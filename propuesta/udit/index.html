<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cotización · Romina Mendieta</title>
    <meta
      name="description"
      content="Propuesta de cotización profesional de diseño editorial."
    />
    <meta property="og:title" content="Cotización profesional" />
    <meta
      property="og:description"
      content="Landing de propuesta editorial premium."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../../assets/css/style.css" />
  </head>
  <body class="propuesta-page">
    <nav class="nav" id="nav">
      <div class="wrap nav__row">
        <a href="../../" class="nav__brand">
          <span class="nav__mark" aria-hidden="true"></span>
          <span>
            Romina Mendieta
            <small>Diseño editorial</small>
          </span>
        </a>
        <div class="nav__links" id="navLinks"></div>
        <div class="nav__actions">
          <span class="nav__validity">Válida 30 días</span>
          <a class="btn btn-primary" href="#contacto">Aceptar propuesta</a>
        </div>
      </div>
    </nav>

    <header class="hero" id="hero">
      <div class="wrap hero__grid">
        <div data-reveal>
          <div class="hero__eyebrow" id="heroEyebrow"></div>
          <h1 id="heroTitle">Cotización profesional</h1>
          <p class="lead" id="heroLead">Propuesta editorial de diseño.</p>
          <div class="hero__meta" id="heroMeta"></div>
        </div>
        <div class="hero__art" data-reveal>
          <div class="stack" aria-hidden="true">
            <div class="stack__layer l3"></div>
            <div class="stack__layer l2"></div>
            <div class="stack__layer l1">
              <span class="stack__glyph">
                <img
                  src="https://ik.imagekit.io/romendieta0207/svg/Recurso%207.png"
                  alt="Logo de Romina Mendieta"
                />
              </span>
            </div>
          </div>
        </div>
      </div>
    </header>

    <section id="servicios">
      <div class="wrap">
        <div class="section-head" data-reveal id="serviciosHead"></div>
        <div class="timeline" data-reveal id="serviciosTimeline"></div>
      </div>
    </section>

    <section id="precios" class="bg-soft">
      <div class="wrap">
        <div class="section-head" data-reveal id="preciosHead"></div>
        <div class="toggle" data-reveal id="preciosToggle"></div>
        <div class="panel is-active" id="panel-mes" data-reveal>
          <div class="plans" id="plansMes"></div>
        </div>
        <div class="panel" id="panel-pieza" data-reveal>
          <div class="table-card">
            <table id="tablaPieza"></table>
          </div>
          <p class="table-note" id="tablaNote"></p>
        </div>
      </div>
    </section>

    <section id="incluye" class="bg-soft">
      <div class="wrap">
        <div class="section-head" data-reveal id="incluyeHead"></div>
        <div class="grid-2" data-reveal id="incluyeGrid"></div>
      </div>
    </section>

    <section id="tiempos">
      <div class="wrap">
        <div class="section-head" data-reveal id="tiemposHead"></div>
        <div class="timeline" data-reveal id="tiemposTimeline"></div>
      </div>
    </section>

    <section id="terminos">
      <div class="wrap">
        <div class="section-head" data-reveal id="terminosHead"></div>
        <div class="terms" data-reveal id="terminosList"></div>
      </div>
    </section>

    <section id="contacto">
      <div class="cta" data-reveal>
        <span class="cta__deco" aria-hidden="true"></span>
        <div class="cta__grid">
          <div id="ctaContent"></div>
          <div class="cta__card" id="ctaCard"></div>
        </div>
      </div>
    </section>

    <footer id="footer">
      <div class="wrap"></div>
    </footer>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
    <script src="../../assets/js/propuesta.js" defer></script>

    <script>
      const nav = document.getElementById("nav");
      window.addEventListener(
        "scroll",
        () => {
          window.scrollY > 8 ?
            nav.classList.add("is-scrolled")
          : nav.classList.remove("is-scrolled");
        },
        { passive: true },
      );

      const revealEls = document.querySelectorAll("[data-reveal]");
      if ("IntersectionObserver" in window) {
        const io = new IntersectionObserver(
          (entries) => {
            entries.forEach((entry) => {
              if (entry.isIntersecting) {
                entry.target.classList.add("in-view");
                io.unobserve(entry.target);
              }
            });
          },
          { threshold: 0.15 },
        );
        revealEls.forEach((el) => io.observe(el));
      } else {
        revealEls.forEach((el) => el.classList.add("in-view"));
      }

      function setUpToggle() {
        const tabMes = document.getElementById("tab-mes");
        const tabPieza = document.getElementById("tab-pieza");
        const panelMes = document.getElementById("panel-mes");
        const panelPieza = document.getElementById("panel-pieza");
        if (!tabMes || !tabPieza) return;
        function showMes() {
          tabMes.classList.add("is-active");
          tabMes.setAttribute("aria-selected", "true");
          tabPieza.classList.remove("is-active");
          tabPieza.setAttribute("aria-selected", "false");
          panelMes.classList.add("is-active");
          panelPieza.classList.remove("is-active");
        }
        function showPieza() {
          tabPieza.classList.add("is-active");
          tabPieza.setAttribute("aria-selected", "true");
          tabMes.classList.remove("is-active");
          tabMes.setAttribute("aria-selected", "false");
          panelPieza.classList.add("is-active");
          panelMes.classList.remove("is-active");
        }
        tabMes.addEventListener("click", showMes);
        tabPieza.addEventListener("click", showPieza);
      }
      window.addEventListener("propuesta:ready", setUpToggle);
    </script>
  </body>
</html>
